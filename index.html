<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hola Nǐhǎo">
<meta name="theme-color" content="#1B2559">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hola Nǐhǎo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,-apple-system,sans-serif;color:#1B2559;background:#f4f1ff}
body[data-mode=kids]{background:linear-gradient(180deg,#fff4d6,#ffe1f0 60%,#e3dcff)}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,#d946ef,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 1px 4px #0002}
.seg button{border:0;background:none;font:inherit;font-weight:700;padding:8px 14px;border-radius:999px;color:#1B2559}
.seg button.on{background:linear-gradient(90deg,#d946ef,#7c3aed);color:#fff}
.btn{border:0;font:inherit;font-weight:800;border-radius:18px;padding:14px 18px;background:#fff;color:#1B2559;box-shadow:0 2px 6px #0002}
.btn.pri{background:linear-gradient(90deg,#d946ef,#7c3aed);color:#fff}
.btn.big{font-size:22px;padding:22px}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 4px 14px #1b255922;text-align:center;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;font:inherit;background:#fff;border-radius:22px;padding:18px 8px;box-shadow:0 3px 10px #1b255922;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:18px;color:#1B2559}
.tile .ic{font-size:46px;line-height:1}
.tile small{font-weight:600;opacity:.6;font-size:13px}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}
.muted{opacity:.6;font-size:14px}
.h{font-size:22px;font-weight:800;margin:14px 0 6px}
.word{font-size:40px;font-weight:800;line-height:1.15}
.hz{font-size:64px;font-weight:800;line-height:1.1}
.py{font-size:26px;font-weight:800;letter-spacing:.5px}
.py span{margin:0 2px}
.emoji{font-size:120px;line-height:1.1}
.kid .word{font-size:46px}
.bar{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d946ef,#7c3aed)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:0;font:inherit;font-weight:800;font-size:19px;padding:16px;border-radius:16px;background:#fff;box-shadow:0 2px 6px #0002;color:#1B2559}
.opt.ok{background:#bbf7d0}.opt.no{background:#fecaca}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.choice{border:0;background:#fff;border-radius:22px;font-size:68px;padding:18px 0;box-shadow:0 3px 10px #1b255933}
.choice.ok{background:#bbf7d0;transform:scale(1.08)}
.shake{animation:sh .4s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{position:fixed;pointer-events:none;font-size:34px;animation:up 1.2s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-260px) rotate(40deg);opacity:0}}
.stars{font-weight:800;background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 1px 4px #0002}
.tips li{margin:8px 0;line-height:1.35}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#7c3aed33}
.hint{font-size:13px;opacity:.6;margin-top:6px}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet>div{background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88%;overflow:auto}
input[type=range]{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------- data ----------
const P=s=>s.trim().split("\n").map((l,i)=>{const [e,en,es,zh,py]=l.split("|");return {e,en,es,zh,py}});
const K={
 animals:{ic:"🐶",n:"Animals",zn:"动物",items:P(`
🐶|dog|el perro|狗|gǒu
🐱|cat|el gato|猫|māo
🐮|cow|la vaca|牛|niú
🐷|pig|el cerdo|猪|zhū
🐦|bird|el pájaro|鸟|niǎo
🐟|fish|el pez|鱼|yú
🐘|elephant|el elefante|大象|dà xiàng
🐵|monkey|el mono|猴子|hóu zi
🐰|rabbit|el conejo|兔子|tù zi
🐴|horse|el caballo|马|mǎ`)},
 colors:{ic:"🌈",n:"Colors",zn:"颜色",items:P(`
🔴|red|rojo|红色|hóng sè
🔵|blue|azul|蓝色|lán sè
🟡|yellow|amarillo|黄色|huáng sè
🟢|green|verde|绿色|lǜ sè
⚪|white|blanco|白色|bái sè
⚫|black|negro|黑色|hēi sè`)},
 food:{ic:"🍎",n:"Food",zn:"食物",items:P(`
🍎|apple|la manzana|苹果|píng guǒ
🍌|banana|el plátano|香蕉|xiāng jiāo
🥛|milk|la leche|牛奶|niú nǎi
💧|water|el agua|水|shuǐ
🍞|bread|el pan|面包|miàn bāo
🍚|rice|el arroz|米饭|mǐ fàn
🥚|egg|el huevo|鸡蛋|jī dàn
🍪|cookie|la galleta|饼干|bǐng gān`)},
 body:{ic:"👀",n:"My Body",zn:"身体",items:P(`
👀|eyes|los ojos|眼睛|yǎn jing
👃|nose|la nariz|鼻子|bí zi
👄|mouth|la boca|嘴|zuǐ
✋|hand|la mano|手|shǒu
👂|ear|la oreja|耳朵|ěr duo
🦶|foot|el pie|脚|jiǎo`)},
 family:{ic:"👨‍👩‍👧",n:"Family",zn:"家人",items:P(`
👩|mom|mamá|妈妈|mā ma
👨|dad|papá|爸爸|bà ba
👶|baby|el bebé|宝宝|bǎo bao
👵|grandma|la abuela|奶奶|nǎi nai
👴|grandpa|el abuelo|爷爷|yé ye`)},
 things:{ic:"⚽",n:"Things",zn:"东西",items:P(`
☀️|sun|el sol|太阳|tài yang
🌙|moon|la luna|月亮|yuè liang
🚗|car|el carro|车|chē
⚽|ball|la pelota|球|qiú
📖|book|el libro|书|shū
🏠|house|la casa|家|jiā
👟|shoes|los zapatos|鞋|xié`)},
 numbers:{ic:"🔢",n:"Numbers",zn:"数字",items:P(`
1️⃣|one|uno|一|yī
2️⃣|two|dos|二|èr
3️⃣|three|tres|三|sān
4️⃣|four|cuatro|四|sì
5️⃣|five|cinco|五|wǔ
6️⃣|six|seis|六|liù
7️⃣|seven|siete|七|qī
8️⃣|eight|ocho|八|bā
9️⃣|nine|nueve|九|jiǔ
🔟|ten|diez|十|shí`)},
 move:{ic:"🏃",n:"Move!",zn:"动一动",items:P(`
🦘|Jump!|¡Salta!|跳|tiào
👏|Clap!|¡Aplaude!|拍手|pāi shǒu
🪑|Sit down|Siéntate|坐下|zuò xia
🧍|Stand up|Levántate|站起来|zhàn qǐ lái
🤗|Hug me!|¡Abrázame!|抱抱|bào bao
💃|Dance!|¡Baila!|跳舞|tiào wǔ`)}
};
Object.entries(K).forEach(([k,d])=>d.items.forEach((x,i)=>x.id=k+i));
const A={
 basics:{ic:"👋",n:"Greetings",items:P(`
|Hello|Hola|你好|nǐ hǎo
|Good morning|Buenos días|早上好|zǎo shang hǎo
|Good night|Buenas noches|晚安|wǎn ān
|Goodbye|Adiós|再见|zài jiàn
|Please|Por favor|请|qǐng
|Thank you|Gracias|谢谢|xiè xie
|You're welcome|De nada|不客气|bú kè qi
|Sorry|Lo siento|对不起|duì bu qǐ
|Yes|Sí|是|shì
|No|No|不是|bú shì
|How are you?|¿Cómo está?|你好吗？|nǐ hǎo ma
|I'm fine, thanks|Estoy bien, gracias|我很好，谢谢|wǒ hěn hǎo xiè xie
|Nice to meet you|Mucho gusto|很高兴认识你|hěn gāo xìng rèn shi nǐ
|My name is…|Me llamo…|我叫…|wǒ jiào
|I don't understand|No entiendo|我不明白|wǒ bù míng bai
|Do you speak English?|¿Habla inglés?|你会说英语吗？|nǐ huì shuō yīng yǔ ma`)},
 daily:{ic:"🧭",n:"Getting around",items:P(`
|Where is the bathroom?|¿Dónde está el baño?|厕所在哪里？|cè suǒ zài nǎ lǐ
|How much is it?|¿Cuánto cuesta?|多少钱？|duō shao qián
|I want…|Quiero…|我想要…|wǒ xiǎng yào
|Water, please|Agua, por favor|请给我水|qǐng gěi wǒ shuǐ
|Help!|¡Ayuda!|救命！|jiù mìng
|Left|Izquierda|左|zuǒ
|Right|Derecha|右|yòu
|Straight ahead|Todo recto|直走|zhí zǒu`)},
 biz:{ic:"💼",n:"Business",items:P(`
|trademark|la marca registrada|商标|shāng biāo
|brand|la marca|品牌|pǐn pái
|lawyer|el abogado|律师|lǜ shī
|price|el precio|价格|jià gé
|order|el pedido|订单|dìng dān
|seller|el vendedor|卖家|mài jiā
|I need to register a trademark|Necesito registrar una marca|我需要注册商标|wǒ xū yào zhù cè shāng biāo
|What can I help you with?|¿En qué puedo ayudarle?|有什么可以帮您？|yǒu shén me kě yǐ bāng nín
|Thank you for your trust|Gracias por su confianza|感谢您的信任|gǎn xiè nín de xìn rèn
|Please send the document|Por favor envíe el documento|请发送文件|qǐng fā sòng wén jiàn`)},
 nums:{ic:"🔢",n:"Numbers 1-10",items:K.numbers.items}
};
Object.entries(A).forEach(([k,d])=>{if(k!=="nums")d.items.forEach((x,i)=>x.id=k+i)});

// ---------- state ----------
const st={get(k,d){try{const v=JSON.parse(localStorage.getItem("hn_"+k));return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("hn_"+k,JSON.stringify(v))}catch(e){}}};
const S={mode:st.get("mode","kids"),lang:st.get("lang","es"),rate:st.get("rate",0.85),stars:st.get("stars",0),srs:st.get("srs",{}),streak:st.get("streak",{d:"",n:0}),scr:"home"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LN={es:"Español",zh:"中文"};
const say_clean=t=>t.replace(/[…¡¿]/g,"").replace(/\s+/g," ");

// ---------- speech ----------
function voiceFor(l){if(!("speechSynthesis" in window))return null;const v=speechSynthesis.getVoices();const pref={es:["es-MX","es-US","es-ES"],zh:["zh-CN","zh-TW","zh-HK"],en:["en-US","en-GB"]}[l];for(const p of pref){const f=v.find(x=>x.lang.replace("_","-")===p);if(f)return f}return v.find(x=>x.lang.toLowerCase().startsWith(l))||null}
function say(t,l,rate){return new Promise(res=>{if(!("speechSynthesis" in window))return res();const u=new SpeechSynthesisUtterance(say_clean(t));u.lang={es:"es-MX",zh:"zh-CN",en:"en-US"}[l];const v=voiceFor(l);if(v)u.voice=v;u.rate=rate;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,9000)})}
let spkId=0;
async function sayAll(parts,rate){const id=++spkId;if("speechSynthesis" in window)speechSynthesis.cancel();for(const [t,l] of parts){if(id!==spkId)return;await say(t,l,rate||S.rate)}}
function sayItem(it,lang,rate){const parts=[];if(lang==="es"||lang==="both")parts.push([it.es,"es"]);if(lang==="zh"||lang==="both")parts.push([it.zh,"zh"]);return sayAll(parts,rate)}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};

// ---------- tone coloring ----------
const TC=["#94a3b8","#ef4444","#f59e0b","#16a34a","#2563eb"];
const tone=s=>/[āēīōūǖ]/.test(s)?1:/[áéíóúǘ]/.test(s)?2:/[ǎěǐǒǔǚ]/.test(s)?3:/[àèìòùǜ]/.test(s)?4:0;
const pyHTML=py=>py.split(" ").map(s=>`<span style="color:${TC[tone(s)]}">${esc(s)}</span>`).join("");
function hzHTML(zh,py){const ch=[...zh];const sy=py.split(" ");if(ch.length!==sy.length||/[…？！，]/.test(zh))return esc(zh);return ch.map((c,i)=>`<span style="color:${TC[tone(sy[i])]}">${c}</span>`).join("")}

// ---------- misc ----------
function today(){return new Date().toISOString().slice(0,10)}
function bumpStreak(){const t=today();if(S.streak.d===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak={d:t,n:S.streak.d===y?S.streak.n+1:1};st.set("streak",S.streak)}
function setMode(m){S.mode=m;if(m==="adult"&&S.lang==="both")S.lang="es";st.set("mode",m);st.set("lang",S.lang);go("home")}
function setLang(l){S.lang=l;st.set("lang",l);render()}
function addStar(){S.stars++;st.set("stars",S.stars)}
function confetti(){const e=["⭐","🎉","✨","🌟","🎈"];for(let i=0;i<14;i++){const s=document.createElement("div");s.className="pop";s.textContent=e[i%e.length];s.style.left=(10+Math.random()*80)+"vw";s.style.top=(55+Math.random()*30)+"vh";s.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function go(scr,extra){Object.assign(S,{scr},extra||{});render();window.scrollTo(0,0)}

// ---------- SRS (adult) ----------
const IV=[0,1,3,7,14,30];
const key=(it)=>it.id+"_"+S.lang;
function due(it){const r=S.srs[key(it)];return !r||r.d<=Date.now()}
function allAdultItems(){const m={};Object.values(A).forEach(d=>d.items.forEach(x=>m[x.id]=x));return Object.values(m)}
function dueCount(){return allAdultItems().filter(due).length}
function rate(it,q){const k=key(it);const r=S.srs[k]||{b:0,d:0};r.b=q===0?0:Math.min(5,r.b+q);r.d=Date.now()+IV[r.b]*864e5;if(q===0)r.d=Date.now()+6e4;S.srs[k]=r;st.set("srs",S.srs)}
function startDeck(k){const items=(k==="due"?allAdultItems():A[k].items).filter(due);const q=shuffle(items).slice(0,10);if(!q.length){go("home",{note:"Nothing due here. Nice work!"});return}go("card",{deck:k,q,i:0,shown:false,heard:"",done:0})}

// ---------- screens ----------
function header(){
 if(S.mode==="kids")return `<div class="top"><div class="seg">${["es","zh","both"].map(l=>`<button data-a="lang" data-v="${l}" class="${S.lang===l?"on":""}">${l==="es"?"🇪🇸":l==="zh"?"🇨🇳":"🇪🇸🇨🇳"}</button>`).join("")}</div><div class="stars">⭐ ${S.stars}</div><button class="btn hold" id="gear" aria-label="Parents: hold">⚙️<i></i></button></div>`;
 return `<div class="top"><div class="brand">Hola Nǐhǎo</div><div class="seg">${["es","zh"].map(l=>`<button data-a="lang" data-v="${l}" class="${S.lang===l?"on":""}">${LN[l]}</button>`).join("")}</div><button class="btn" data-a="parent">⚙️</button></div>`}

function home(){
 if(S.mode==="kids")return `<div class="grid">${Object.entries(K).map(([k,d])=>`<button class="tile" data-a="kcat" data-v="${k}"><span class="ic">${d.ic}</span>${d.n}<small>${d.zn}</small></button>`).join("")}</div><p class="hint" style="text-align:center">Tap a picture. Hold ⚙️ for the parent corner.</p>`;
 const dc=dueCount();
 return `${S.note?`<div class="card">${esc(S.note)}</div>`:""}
 <div class="card"><div class="muted">${LN[S.lang]} · ${S.streak.n?`🔥 ${S.streak.n} day${S.streak.n>1?"s":""}`:"start a streak today"}</div><div class="word" style="font-size:34px">${dc} to review</div><div class="row"><button class="btn pri" data-a="deck" data-v="due">Review now</button><button class="btn" data-a="quiz">🎧 Listening quiz</button></div></div>
 <div class="h">Decks</div><div class="grid">${Object.entries(A).map(([k,d])=>`<button class="tile" data-a="deck" data-v="${k}"><span class="ic">${d.ic}</span>${d.n}<small>${d.items.length} cards · ${d.items.filter(due).length} due</small></button>`).join("")}</div>`}

function card(){
 const it=S.q[S.i];const n=S.q.length;
 if(!it)return `<div class="card"><div class="emoji">🎉</div><div class="word">Done!</div><p class="muted">You reviewed ${S.done} card${S.done===1?"":"s"}.</p><button class="btn pri big" data-a="home">Back</button></div>`;
 const back=S.shown;
 return `<div class="bar"><i style="width:${S.i/n*100}%"></i></div><div class="card"><div class="muted">${S.i+1} / ${n} · How do you say…</div><div class="word" style="margin:14px 0">${esc(it.en)}</div>
 ${back?`<hr style="border:0;border-top:1px solid #eee;margin:14px 0">${S.lang==="zh"?`<div class="hz">${hzHTML(it.zh,it.py)}</div><div class="py">${pyHTML(it.py)}</div>`:`<div class="word" style="color:#7c3aed">${esc(it.es)}</div>`}
 <div class="row" style="margin-top:14px"><button class="btn" data-a="hear">🔊 Hear</button><button class="btn" data-a="slow">🐢 Slow</button>${SR?`<button class="btn" data-a="mic">🎤 Say it</button>`:""}</div>${S.heard?`<div class="muted" style="margin-top:8px">${S.heard}</div>`:""}`:`<button class="btn pri big" data-a="reveal" style="margin-top:8px">Show answer</button><div class="hint">Say it out loud first, then check.</div>`}</div>
 ${back?`<div class="row"><button class="btn" style="background:#fecaca" data-a="rate" data-v="0">Again</button><button class="btn" style="background:#fde68a" data-a="rate" data-v="1">Good</button><button class="btn" style="background:#bbf7d0" data-a="rate" data-v="2">Easy</button></div>`:""}
 <button class="btn" data-a="home" style="margin-top:8px">← Stop</button>`}

function quiz(){
 const Q=S.qz;if(Q.i>=Q.items.length)return `<div class="card"><div class="emoji">🏆</div><div class="word">${Q.score} / ${Q.items.length}</div><button class="btn pri big" data-a="quiz" style="margin-top:12px">Again</button> <button class="btn big" data-a="home">Back</button></div>`;
 const it=Q.items[Q.i];
 return `<div class="bar"><i style="width:${Q.i/Q.items.length*100}%"></i></div><div class="card"><div class="muted">Listen, then pick the meaning · ${Q.i+1}/${Q.items.length}</div><button class="btn pri big" data-a="qhear" style="margin:14px 0">🔊 Play</button>${Q.reveal?`<div class="py" style="margin-top:8px">${S.lang==="zh"?hzHTML(it.zh,it.py)+"<br>"+pyHTML(it.py):esc(it.es)}</div>`:""}</div>
 <div class="opts">${Q.opts.map((o,i)=>`<button class="opt ${Q.sel!=null?(o.id===it.id?"ok":i===Q.sel?"no":""):""}" data-a="qpick" data-v="${i}">${esc(o.en)}</button>`).join("")}</div><button class="btn" data-a="home" style="margin-top:14px">← Stop</button>`}
function startQuiz(){const items=shuffle(allAdultItems()).slice(0,10);S.qz={items,i:0,score:0,sel:null,reveal:false};setOpts();go("quiz")}
function setOpts(){const Q=S.qz;const it=Q.items[Q.i];if(!it)return;const all=allAdultItems();Q.opts=shuffle([it,...shuffle(all.filter(x=>x.id!==it.id)).slice(0,3)]);Q.sel=null;Q.reveal=false}

function kcat(){const d=K[S.kc];return `<div class="card"><div class="emoji" style="font-size:90px">${d.ic}</div><div class="word">${d.n}</div><div class="muted">${d.zn}</div></div><div class="row" style="flex-direction:column"><button class="btn pri big" data-a="klearn">👀 Learn</button><button class="btn big" data-a="kgame">🎯 Find it!</button></div><button class="btn" data-a="home" style="margin-top:10px">← Back</button>`}
function klearn(){
 const items=K[S.kc].items;const it=items[S.ki];
 return `<div class="bar"><i style="width:${(S.ki+1)/items.length*100}%"></i></div><div class="card kid" data-a="ksay" style="padding:26px 12px"><div class="emoji">${it.e}</div>
 ${S.lang!=="zh"?`<div class="word" style="color:#7c3aed">${esc(it.es)}</div>`:""}
 ${S.lang!=="es"?`<div class="hz" style="font-size:56px">${hzHTML(it.zh,it.py)}</div><div class="py">${pyHTML(it.py)}</div>`:""}
 <div class="muted" style="margin-top:8px">${esc(it.en)}</div></div>
 <div class="row"><button class="btn big" data-a="kprev">◀</button><button class="btn pri big" data-a="ksay">🔊</button><button class="btn big" data-a="knext">▶</button></div><button class="btn" data-a="kcat2" style="margin-top:8px">← Back</button>`}
function kgame(){
 const g=S.g;if(g.n>=5)return `<div class="card"><div class="emoji">🎉</div><div class="word">¡Muy bien! 太棒了!</div><p class="muted">⭐ ${S.stars}</p></div><div class="row"><button class="btn pri big" data-a="kgame">Again</button><button class="btn big" data-a="kcat2">Done</button></div>`;
 return `<div class="bar"><i style="width:${g.n/5*100}%"></i></div><div class="card"><div class="muted">Where is…?</div><button class="btn pri big" data-a="gsay" style="margin-top:10px">🔊 Listen</button></div>
 <div class="choices">${g.opts.map((o,i)=>`<button class="choice ${g.ok===i?"ok":""}" data-a="gpick" data-v="${i}">${o.e}</button>`).join("")}</div><button class="btn" data-a="kcat2" style="margin-top:14px">← Back</button>`}
function newRound(){const g=S.g;const items=K[S.kc].items;g.t=items[Math.random()*items.length|0];g.opts=shuffle([g.t,...shuffle(items.filter(x=>x!==g.t)).slice(0,2)]);g.ok=null;g.lock=false}

function tips(){return `<div class="sheet" data-a="closeparent"><div onclick="event.stopPropagation()"><div class="h" style="margin-top:0">Parent corner</div>
 <div class="row"><button class="btn ${S.mode==="kids"?"pri":""}" data-a="mode" data-v="kids">🧸 Kids</button><button class="btn ${S.mode==="adult"?"pri":""}" data-a="mode" data-v="adult">🎓 Adult</button></div>
 <div class="muted" style="margin-top:8px">Voice speed</div><input type="range" min="0.5" max="1.1" step="0.05" value="${S.rate}" id="rate"><div class="h">Teaching a 3-year-old</div>
 <ul class="tips"><li><b>5 minutes, a few times a day.</b> Stop while it's still fun.</li><li><b>Real things beat screens.</b> Tap the nose card, then touch a real nose: <i>la nariz · 鼻子</i>.</li><li><b>Move!</b> Action words (jump, clap, hug) are the easiest way in for little ones.</li><li><b>One language per moment.</b> E.g. Spanish at breakfast, Mandarin at bath time.</li><li><b>Repeat the same ~5 words all week</b>, then add one.</li><li><b>Don't quiz, model.</b> If they say "perro", answer "¡Sí, el perro!".</li><li><b>Mandarin tones:</b> exaggerate them with a hand wave, sing them.</li><li><b>Songs and cartoons in the language help</b> — watch together.</li></ul>
 <div class="row"><button class="btn" data-a="reset">Reset progress</button><button class="btn pri" data-a="closeparent">Close</button></div></div></div>`}

function render(){
 document.body.dataset.mode=S.mode;let h=header();
 const sc=S.scr;
 h+=sc==="home"?home():sc==="card"?card():sc==="quiz"?quiz():sc==="kcat"?kcat():sc==="klearn"?klearn():sc==="kgame"?kgame():"";
 if(S.parent)h+=tips();
 $("#app").innerHTML=h;bindGear();const r=$("#rate");if(r)r.oninput=e=>{S.rate=+e.target.value;st.set("rate",S.rate)};
}
function bindGear(){const g=$("#gear");if(!g)return;let t,raf,s;const bar=g.querySelector("i");const stop=()=>{clearTimeout(t);cancelAnimationFrame(raf);bar.style.width="0"};const start=e=>{e.preventDefault();s=Date.now();t=setTimeout(()=>{stop();S.parent=true;render()},1200);const f=()=>{bar.style.width=Math.min(100,(Date.now()-s)/12)+"%";raf=requestAnimationFrame(f)};f()};g.addEventListener("touchstart",start,{passive:false});g.addEventListener("mousedown",start);["touchend","touchcancel","mouseup","mouseleave"].forEach(ev=>g.addEventListener(ev,stop))}

// ---------- speech recognition ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(it){const r=new SR();r.lang=S.lang==="zh"?"zh-CN":"es-MX";r.interimResults=false;S.heard="Listening…";render();r.onresult=e=>{const h=e.results[0][0].transcript;const tgt=S.lang==="zh"?it.zh:it.es;const norm=s=>s.toLowerCase().replace(/[¡¿!?.,…？！，。\s]/g,"");S.heard=`You said: “${esc(h)}” ${norm(h)===norm(tgt)?"✅":"🙂 close? Try again"}`;render()};r.onerror=()=>{S.heard="Couldn't hear that. Check the mic permission.";render()};r.start()}

// ---------- events ----------
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 if(a==="closeparent"){S.parent=false;return render()}
 if(a==="lang")return setLang(v);
 if(a==="parent"){S.parent=true;return render()}
 if(a==="mode"){S.parent=false;return setMode(v)}
 if(a==="reset"){if(confirm("Reset all progress and stars?")){S.srs={};S.stars=0;S.streak={d:"",n:0};st.set("srs",{});st.set("stars",0);st.set("streak",S.streak);S.parent=false;go("home")}return}
 if(a==="home")return go("home",{note:""});
 if(a==="deck")return startDeck(v);
 if(a==="quiz")return startQuiz();
 const it=S.q&&S.q[S.i];
 if(a==="reveal"){S.shown=true;S.heard="";render();return it&&sayAll(S.lang==="zh"?[[it.zh,"zh"]]:[[it.es,"es"]])}
 if(a==="hear")return sayAll(S.lang==="zh"?[[it.zh,"zh"]]:[[it.es,"es"]]);
 if(a==="slow")return sayAll(S.lang==="zh"?[[it.zh,"zh"]]:[[it.es,"es"]],0.5);
 if(a==="mic")return listen(it);
 if(a==="rate"){rate(it,+v);bumpStreak();S.done++;if(+v===0)S.q.push(it);S.i++;S.shown=false;S.heard="";return render()}
 if(a==="qhear"){const q=S.qz.items[S.qz.i];return sayAll(S.lang==="zh"?[[q.zh,"zh"]]:[[q.es,"es"]])}
 if(a==="qpick"){const Q=S.qz;if(Q.sel!=null)return;Q.sel=+v;const q=Q.items[Q.i];const ok=Q.opts[Q.sel].id===q.id;if(ok){Q.score++;bumpStreak()}Q.reveal=true;render();sayAll(S.lang==="zh"?[[q.zh,"zh"]]:[[q.es,"es"]]);setTimeout(()=>{Q.i++;setOpts();render()},ok?1400:2400);return}
 if(a==="kcat"){S.kc=v;return go("kcat")}
 if(a==="kcat2")return go("kcat");
 if(a==="klearn"){S.ki=0;go("klearn");return sayItem(K[S.kc].items[0],S.lang)}
 if(a==="kprev"||a==="knext"){const n=K[S.kc].items.length;S.ki=(S.ki+(a==="knext"?1:-1)+n)%n;render();return sayItem(K[S.kc].items[S.ki],S.lang)}
 if(a==="ksay")return sayItem(K[S.kc].items[S.ki],S.lang,0.75);
 if(a==="kgame"){S.g={n:0};newRound();go("kgame");return sayItem(S.g.t,S.lang==="both"?"es":S.lang,0.8)}
 if(a==="gsay")return sayItem(S.g.t,S.lang==="both"?"es":S.lang,0.8);
 if(a==="gpick"){const g=S.g;if(g.lock)return;const o=g.opts[+v];if(o===g.t){g.lock=true;g.ok=+v;addStar();bumpStreak();confetti();render();const cheer=S.lang==="zh"?[["太棒了","zh"]]:S.lang==="es"?[["¡Muy bien!","es"]]:[["¡Muy bien!","es"],["太棒了","zh"]];sayAll([[S.lang==="zh"?g.t.zh:g.t.es,S.lang==="zh"?"zh":"es"],...cheer]);setTimeout(()=>{g.n++;if(g.n<5)newRound();render();if(g.n<5)sayItem(g.t,S.lang==="both"?"es":S.lang,0.8)},2600)}else{el.classList.add("shake");sayItem(g.t,S.lang==="both"?"es":S.lang,0.8)}return}
});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
